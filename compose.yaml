services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: agent-study-postgres
    environment:
      POSTGRES_DB: agent_study
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_password
    ports:
      - "5432:5432"
    volumes:
      - agent-study-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_study"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agent-study-postgres-data: